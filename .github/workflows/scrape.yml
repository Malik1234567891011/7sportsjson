name: Refresh programs.json

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-programs
  cancel-in-progress: true

jobs:
  scrape:
    # Dependency names are resolved at runtime (see the install step), so this
    # can safely track ubuntu-latest across releases.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: qidigo-scraper/package-lock.json

      - name: Install Chromium dependencies
        run: |
          set -euo pipefail
          sudo apt-get update

          # Ubuntu keeps moving these package names around. 24.04 added the
          # *t64 suffix to the time_t-transition libraries, and 26.04 went
          # further: the old names are now *virtual* packages with two
          # providers each, which apt flatly refuses to install
          # ("has no installation candidate").
          #
          # This step used to branch on `VERSION_CODENAME = noble`, which meant
          # anything NEWER than noble fell into the pre-24.04 branch and asked
          # for the old names. That is exactly what broke on 2026-11-03, when
          # ubuntu-latest rolled from noble to resolute (26.04) and every run
          # started dying on libasound2.
          #
          # So: stop guessing from the release number and ask apt which name
          # actually resolves on this runner. A package that exists under
          # neither name is skipped rather than failing the build.
          have() { apt-cache policy "$1" 2>/dev/null | grep -qE 'Candidate: [0-9]'; }
          pick() { for n in "$@"; do if have "$n"; then printf '%s ' "$n"; break; fi; done; return 0; }

          PKGS=""
          # Renamed in the t64 transition: prefer the new name, fall back to the old.
          for base in libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
                      libcups2 libglib2.0-0 libgtk-3-0; do
            PKGS="$PKGS$(pick "${base}t64" "$base")"
          done
          PKGS="$PKGS$(pick libgcc-s1 libgcc1)"

          # Names that have been stable across releases.
          for p in ca-certificates fonts-liberation wget xdg-utils lsb-release \
                   libcairo2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 \
                   libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
                   libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
                   libxdamage1 libxext6 libxfixes3 libxi6 libxkbcommon0 \
                   libxrandr2 libxrender1 libxss1 libxtst6; do
            PKGS="$PKGS$(pick "$p")"
          done

          echo "Runner: $(. /etc/os-release; echo "$VERSION_CODENAME $VERSION_ID")"
          echo "Installing:$PKGS"
          sudo apt-get install -y $PKGS

      - name: Install deps
        working-directory: qidigo-scraper
        run: npm ci

      - name: Run full scrape
        working-directory: qidigo-scraper
        run: npm run scrape:full

      - name: Copy JSON to repo root for WordPress
        run: cp qidigo-scraper/programs.json programs.json

      - name: Validate JSON before commit
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('programs.json', 'utf8'));
            if (!Array.isArray(data) || data.length === 0) {
              throw new Error('Invalid or empty JSON');
            }
          "

      - name: Commit updated JSON if changed
        run: |
          git add -f qidigo-scraper/programs.json programs.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-refresh programs.json"
          git pull --rebase
          git push
